# Every check the design work depends on, on every push and every pull request.
#
# `deploy.yml` runs the unit tests and the build before publishing, which is what stops a broken
# `master` from reaching the live site. It does not run the browser suite, so until this existed a
# layout regression, a new accessibility violation or a bundle that had quietly doubled could all
# land and only be noticed by someone looking. The three kinds of check are described in
# `docs/ui-testing.md`.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the running check pointless, so stop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit tests (component renders, axe over each one, the design-token contrast checks), the three
  # TypeScript projects, the build, and the size ceilings the build has to stay under.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # `npm run build` typechecks all three projects first, so this covers `npm run typecheck` too.
      - run: npm run build

      - run: npm run check:budgets

      - run: node scripts/verify-pwa.mjs

  # Screenshot baselines and the layout measurements, in a real browser at three widths.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The baselines committed to this repo were taken on Linux, which is what this runner is, so
      # they compare directly. Playwright names a screenshot after its platform, so a run on any
      # other operating system would report a missing snapshot rather than a difference.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The report names which measurement moved and shows the pixels that differ, which is the only
      # useful thing to look at when this job fails.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
